<!DOCTYPE html>

      padding: 0;
      box-sizing: border-box;
    }

    body {

      align-items: flex-start;
      min-height: 100vh;
      color: #222;
      height: 100vh;
      overflow: hidden;

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;

      box-shadow: 0 0 30px rgba(0,0,0,0.03);

    /* Privacy overlay */
    .privacy-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;

      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: 0.3s;
    }
    .privacy-overlay.hidden-privacy {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .privacy-modal {
      background: white;
      border-radius: 28px;
      padding: 28px 22px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);

    .privacy-modal h3 {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: 650;
    }
    .privacy-modal p {
      font-size: 14px;
      color: #6b6b70;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .privacy-link {
      color: #007aff;
      font-weight: 600;
      text-decoration: none;
    }
    .accept-privacy-btn {
      background: #007aff;
      border: none;
      color: white;
      font-weight: 650;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 40px;
      width: 100%;
      transition: 0.2s;
      cursor: pointer;
    }
    .accept-privacy-btn:active {
      background: #005bbf;
      transform: scale(0.97);
    }

    /* Scroll area */
    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
      background: #f7f7f8;
    }

    /* Clean header without address block */
    .header {
      background: #ffffff;
      padding: 16px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f2;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cart-icon-wrap {
      background: #f2f2f7;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: 0.2s;

    .cart-icon-wrap:active {
      background: #e5e5ea;

    .cart-badge {

      font-size: 11px;
      font-weight: 700;
      border-radius: 12px;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;

      display: flex;
      gap: 8px;

<script>
// ========== КОНФИГУРАЦИЯ ==========
const CONFIG = {
  PROXY_URL: 'https://sinedmur-sinedmurgithubio.vercel.app/api/send-order',
  MANAGER_CHAT_ID: '1019928513'
};

function getTelegramUserInfo() {
  const tg = window.Telegram?.WebApp;
  if (!tg) return { id: 'unknown', username: 'unknown', firstName: 'Гость', lastName: '', fullName: 'Гость' };
  const user = tg.initDataUnsafe?.user;
  if (user) {
    return {
      id: user.id || 'unknown',
      username: user.username || '',
      firstName: user.first_name || '',
      lastName: user.last_name || '',
      fullName: [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Пользователь'
    };
  }
  return { id: 'unknown', username: 'unknown', firstName: 'Гость', lastName: '', fullName: 'Гость' };
}

async function sendOrderToTelegram(order) {
  const userInfo = getTelegramUserInfo();
  const payload = {
    userName: userInfo.fullName,
    userId: userInfo.id,
    userUsername: userInfo.username,
    phone: order.phone,
    date: order.date,
    address: order.address,
    items: order.items,
    total: order.total,
    kcal: order.kcal
  };
  const response = await fetch(CONFIG.PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await response.json();
  if (!data.success) throw new Error(data.error || 'Ошибка');
  return { success: true };
}

    const totalItems = cart.reduce((s, i) => s + i.quantity, 0);

    }
    const totalPrice = cart.reduce((s, i) => s + i.price * i.quantity, 0);
    const totalKcal = cart.reduce((s, i) => s + i.kcal * i.quantity, 0);
    popupTotalPrice.textContent = totalPrice;

    if (!address) {
      alert('Укажите адрес доставки');
      return;
    }
    if (!validatePhone(phone)) {
      popupPhoneError.style.display = 'block';
      return;
    }

    const orderDetails = {
      items: cart.map(i => ({ name: i.name, quantity: i.quantity, price: i.price })),
      total: cart.reduce((s, i) => s + i.price*i.quantity, 0),
      kcal: cart.reduce((s, i) => s + i.kcal*i.quantity, 0),
      address: `${district}, ${address}`,
      phone: phone,
      date: new Date().toLocaleString('ru-RU'),
    };

    try {
      await sendOrderToTelegram(orderDetails);
      cart = [];
      updateCartUI();
      closeCheckoutPopup();
      if (tg?.showPopup) tg.showPopup({title: '✅ Заказ оформлен', message: 'Менеджер уже получил уведомление!'});
      else alert('Заказ отправлен!');
    } catch (e) {
      alert('Ошибка отправки. Попробуйте позже.');
    }
  }

  checkoutBtn.addEventListener('click', openCheckoutPopup);
  confirmOrderBtn.addEventListener('click', processOrderFromPopup);
  checkoutPopup.addEventListener('click', (e) => {
    if (e.target === checkoutPopup) closeCheckoutPopup();
  });

  categoryChips.forEach(chip => {
    chip.addEventListener('click', () => {
      categoryChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentCategory = chip.dataset.category;
      renderMenu();
    });
  });

  renderMenu();
  updateCartUI();
  document.querySelector('.cart-badge').style.display = 'none';
})();
</script>
</body>
</html>
